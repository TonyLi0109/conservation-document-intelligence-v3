<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Only the document identity crosses this component boundary. Conversation
// content remains in Streamlit session state and is never written to storage.
const pageKey = "__v3ConversationPageId";
let lastNotification = "";
function notify(value) {
  const signature = JSON.stringify(value);
  if (signature === lastNotification) return;
  lastNotification = signature;
  window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:setComponentValue", value}, window.location.origin);
}
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.origin !== window.location.origin || event.data.type !== "streamlit:render") return;
  const args = event.data.args;
  document.documentElement.dataset.runtimeVersion = args.runtime_version || "";
  try {
    // A parent-window property survives component remounts and Streamlit reruns,
    // but disappears when the browser reloads this app document.
    if (!window.parent[pageKey]) window.parent[pageKey] = crypto.randomUUID();
    // Delete only this app's former history archive. Storage can be disabled;
    // that must not stop a temporary page session from working.
    try { localStorage.removeItem("v3-conversation-history-v1"); } catch (_) {}
    notify({status:"ready", page_id:window.parent[pageKey]});
  } catch (_) {
    notify({status:"page_error"});
  }
});
window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:componentReady", apiVersion:1}, window.location.origin);
window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:setFrameHeight", height:0}, window.location.origin);
</script></body></html>
