name: Offline regression and evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m "not integration"
      - run: python -m pytest -q -m integration
      - run: python -m evaluation.run --baseline evaluation/baselines/offline.json --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evaluation-report
          path: evaluation/reports/latest.*
          if-no-files-found: ignore
